name: Vertflux 构建检查与部署

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: '检查通过后部署到现有 Cloudflare 项目（仅生产分支有效）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vertflux-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建与检查
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: |
          npm ci
      - name: 检查类型和运行单元测试
        run: |
          npx tsc --noEmit
          npm run test -- --run
      - name: 构建 Cloudflare Worker
        run: |
          npx opennextjs-cloudflare build
      - name: 部署 AI 绘图 Worker
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf8566234d0f57c2451986e3cdcb01c4
        run: |
          npx opennextjs-cloudflare deploy
      - name: 部署域名入口
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf8566234d0f57c2451986e3cdcb01c4
        run: |
          cd deploy/vertflux-gateway
          ../../node_modules/.bin/wrangler pages deploy site --project-name vertflux-aidraw --branch main --commit-hash "$GITHUB_SHA"
      - name: 验证生产入口
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 45 https://aidraw.vertflux.com/zh --output /dev/null
